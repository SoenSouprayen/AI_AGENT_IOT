name: ai-agent-iot

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: [CMD-SHELL, "OLLAMA_HOST=http://127.0.0.1:11434 ollama list > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: [/bin/sh, -c]
    command:
      - 'ollama show "$${LLM_MODEL}" >/dev/null 2>&1 || ollama pull "$${LLM_MODEL}"'
    restart: "no"

  agent:
    build: .
    command:
      - --no-browser
      - --host
      - 0.0.0.0
      - --port
      - ${AGENT_PORT:-8501}
      - --llm-model
      - ${LLM_MODEL:-llama3.2:3b}
      - --timeout
      - ${OLLAMA_TIMEOUT:-180}
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      AGENT_PORT: ${AGENT_PORT:-8501}
    ports:
      - "127.0.0.1:${AGENT_PORT:-8501}:${AGENT_PORT:-8501}"
    volumes:
      - type: bind
        source: ./data/processed/scenario_dataset_1deg.csv
        target: /app/data/processed/scenario_dataset_1deg.csv
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./models/per_model/per_predictor_A_Geometry_1deg.joblib
        target: /app/models/per_model/per_predictor_A_Geometry_1deg.joblib
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['AGENT_PORT'] + '/api/config', timeout=5).close()"
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  ollama_models:
